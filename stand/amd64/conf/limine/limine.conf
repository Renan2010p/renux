# Renux - Limine boot configuration
#
# The loader (Limine) loads the kernel and nothing else: the root filesystem is
# embedded in the kernel itself (FreeBSD's MD_ROOT, sys/dev/md/md.c), so there
# are no modules to load. See the FreeBSD Handbook ("The FreeBSD Booting
# Process", "Stage Three") and md(4) for the model being followed.
#
# Global options
timeout: 0
serial: yes
serial_baudrate: 115200
default_entry: 1

# Menu entries
/Renux (amd64)
    protocol: limine
    path: boot():/boot/renux/kernel
    cmdline: console=com0
