# Renux - Limine boot configuration
#
# Global options
timeout: 0
serial: yes
serial_baudrate: 115200
default_entry: 1

# Menu entries
/Renux (amd64)
    protocol: limine
    path: boot():/boot/renux/kernel
    module_path: boot():/sbin/init
    module_path: boot():/usr/libexec/getty
    module_path: boot():/usr/bin/login
    module_path: boot():/bin/sh
    module_path: boot():/bin/ls
    module_path: boot():/bin/cat
    module_path: boot():/bin/echo
    module_path: boot():/bin/pwd
    module_path: boot():/bin/mkdir
    module_path: boot():/bin/rm
    module_path: boot():/bin/rmdir
    module_path: boot():/bin/hello
    module_path: boot():/bin/wc
    module_path: boot():/bin/tui
    module_path: boot():/bin/nano
    module_path: boot():/bin/edit
    module_path: boot():/bin/dmesg
    module_path: boot():/usr/bin/logger
    module_path: boot():/usr/bin/stat
    module_path: boot():/usr/sbin/syslogd
    module_path: boot():/libexec/ld-elf.so.1
    module_path: boot():/lib/libc.so.1
    module_path: boot():/bin/dynhello
    module_path: boot():/etc/rc.d/syslogd
    module_path: boot():/etc/rc
    cmdline: console=com0
