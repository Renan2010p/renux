# /boot/defaults/loader.conf -- default loader settings.
#
# Do not edit this file: put local changes in /boot/loader.conf, which the
# loader reads after this one (and /boot/loader.conf.local after that). The
# variable names are FreeBSD's, so loader.conf(5) describes them; only the ones
# the Renux loader implements are listed.

###  Basic configuration options  ###########################
kernel="kernel"			# /boot/${kernel}/${bootfile}
bootfile="kernel"		# Kernel file name in that directory
kernels="kernel kernel.old"	# Kernels the menu offers (those that exist)
console="vidconsole comconsole"	# vidconsole, comconsole, or both

###  Loader settings  ########################################
autoboot_delay="10"		# Seconds before autoboot ("NO" to disable)
beastie_disable="NO"		# YES skips the menu (prompt with autoboot)
loader_logo="renux"		# renux, renuxbw or none
loader_menu_title="Welcome to Renux"
#loader_color="NO"		# Monochrome menu

###  Kernel boot flags  ######################################
#boot_single="YES"		# Single user mode (boot -s)
#boot_verbose="YES"		# Verbose boot messages (boot -v)
